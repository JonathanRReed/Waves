name: Temporary release handoff migration

on:
  push:
    branches:
      - release/v1.6.0
    paths:
      - .github/workflows/temporary-release-handoff-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.6.0
          fetch-depth: 0

      - name: Replace release-specific handoff filenames with metadata-derived names
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(old, new, 1))

          release_tool = "script/release_tool.rb"
          replace_once(release_tool, "    FILES = %w[\n", "    STATIC_FILES = %w[\n")
          replace_once(release_tool, "      Waves-1.5.0-13.dmg\n", "")
          replace_once(
              release_tool,
              '''      actual = Dir.children(root).sort
              raise Error, "Elgato handoff file set is not exact" unless actual == FILES
              FILES.each do |name|
          ''',
              '''      expected_files = files(metadata)
              actual = Dir.children(root).sort
              raise Error, "Elgato handoff file set is not exact" unless actual == expected_files
              expected_files.each do |name|
          ''',
          )
          replace_once(release_tool, "        write_checksums!(staging)\n", "        write_checksums!(staging, metadata)\n")
          replace_once(release_tool, "      verify_checksums!(root)\n", "      verify_checksums!(root, metadata)\n")
          replace_once(
              release_tool,
              '''    def dmg_name(metadata)
              "Waves-#{metadata.fetch('version')}-#{metadata.fetch('build')}.dmg"
            end
          ''',
              '''    def dmg_name(metadata)
              "Waves-#{metadata.fetch('version')}-#{metadata.fetch('build')}.dmg"
            end

            def files(metadata)
              (STATIC_FILES + [dmg_name(metadata)]).sort
            end
          ''',
          )
          replace_once(
              release_tool,
              '''    def write_checksums!(root)
              names = FILES - %w[SHA256SUMS results.json]
          ''',
              '''    def write_checksums!(root, metadata)
              names = files(metadata) - %w[SHA256SUMS results.json]
          ''',
          )
          replace_once(
              release_tool,
              '''    def verify_checksums!(root)
              expected_names = FILES - %w[SHA256SUMS results.json]
          ''',
              '''    def verify_checksums!(root, metadata)
              expected_names = files(metadata) - %w[SHA256SUMS results.json]
          ''',
          )

          collector = "release/elgato-handoff/collect-diagnostics.sh"
          replace_once(
              collector,
              '''/usr/bin/shasum -a 256 \\
            "$SCRIPT_ROOT/Waves-1.5.0-13.dmg" \\
            "$SCRIPT_ROOT/com.jonathanreed.waves.streamDeckPlugin" \\
            >"$OUTPUT_ROOT/handoff-artifact-checksums.txt"
          ''',
              '''HANDOFF_JSON="$SCRIPT_ROOT/handoff.json"
          DMG_NAME="$(
            /usr/bin/ruby --disable-gems -rjson -e '
              handoff = JSON.parse(File.read(ARGV.fetch(0)))
              name = handoff.fetch("artifacts").fetch("dmg").fetch("name")
              unless name.is_a?(String) && File.basename(name) == name &&
                  name.match?(/\\AWaves-\\d+\\.\\d+\\.\\d+-\\d+\\.dmg\\z/)
                abort("unsafe handoff DMG name")
              end
              puts name
            ' "$HANDOFF_JSON"
          )"
          /usr/bin/shasum -a 256 \\
            "$SCRIPT_ROOT/$DMG_NAME" \\
            "$SCRIPT_ROOT/com.jonathanreed.waves.streamDeckPlugin" \\
            >"$OUTPUT_ROOT/handoff-artifact-checksums.txt"
          ''',
          )

          finalizer = "release/elgato-handoff/finalize-receipt.rb"
          replace_once(finalizer, "  IMMUTABLE_FILES = %w[\n", "  STATIC_IMMUTABLE_FILES = %w[\n")
          replace_once(finalizer, "    Waves-1.5.0-13.dmg\n", "")
          replace_once(
              finalizer,
              '''    exact_keys!(handoff["artifacts"]["dmg"], %w[name sha256], "handoff DMG")
              sha256!(handoff["artifacts"]["dmg"]["sha256"], "handoff DMG SHA-256")
          ''',
              '''    exact_keys!(handoff["artifacts"]["dmg"], %w[name sha256], "handoff DMG")
              sha256!(handoff["artifacts"]["dmg"]["sha256"], "handoff DMG SHA-256")
              dmg_name = handoff["artifacts"]["dmg"]["name"]
              expected_dmg_name = "Waves-#{handoff.fetch('version')}-#{handoff.fetch('build')}.dmg"
              unless dmg_name.is_a?(String) && File.basename(dmg_name) == dmg_name &&
                  dmg_name == expected_dmg_name
                raise Error, "handoff DMG name is not canonical"
              end
          ''',
          )
          replace_once(
              finalizer,
              '''    raise Error, "handoff checksum file set is not exact" unless checksums.keys.sort == IMMUTABLE_FILES
          ''',
              '''    immutable_files = (
              STATIC_IMMUTABLE_FILES + [handoff.fetch("artifacts").fetch("dmg").fetch("name")]
            ).sort
              unless checksums.keys.sort == immutable_files
                raise Error, "handoff checksum file set is not exact"
              end
          ''',
          )

          tests = "script/tests/release_infra_test.rb"
          replace_once(
              tests,
              '''      assert_includes collector, "/usr/sbin/system_profiler"
              refute_match(/defaults write|tccutil|killall|rm -rf/, collector)
          ''',
              '''      assert_includes collector, "/usr/sbin/system_profiler"
              assert_includes collector, 'fetch("artifacts").fetch("dmg").fetch("name")'
              refute_includes collector, "Waves-1.5.0-13.dmg"
              refute_match(/defaults write|tccutil|killall|rm -rf/, collector)
          ''',
          )

          for path in [release_tool, collector, finalizer]:
              if "Waves-1.5.0-13.dmg" in Path(path).read_text():
                  raise SystemExit(f"{path}: stale release-specific DMG filename remains")
          PY

          ruby -c script/release_tool.rb
          ruby -c release/elgato-handoff/finalize-receipt.rb
          bash -n release/elgato-handoff/collect-diagnostics.sh
          ruby -Itest script/tests/release_infra_test.rb --name '/elgato_handoff/'
          git diff --check

          git config user.name "Jonathan R. Reed"
          git config user.email "130617826+JonathanRReed@users.noreply.github.com"
          git add \
            script/release_tool.rb \
            script/tests/release_infra_test.rb \
            release/elgato-handoff/collect-diagnostics.sh \
            release/elgato-handoff/finalize-receipt.rb
          git diff --cached --check
          git commit -m "fix(release): derive handoff artifacts from metadata"
          git push origin HEAD:release/v1.6.0
