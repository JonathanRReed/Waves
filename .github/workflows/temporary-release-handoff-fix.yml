name: Temporary release handoff migration

on:
  push:
    branches:
      - release/v1.6.0
    paths:
      - .github/workflows/temporary-release-handoff-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.6.0
          fetch-depth: 0

      - name: Replace release-specific handoff filenames with metadata-derived names
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_sequence(lines, old, new, label):
              matches = [
                  index
                  for index in range(len(lines) - len(old) + 1)
                  if lines[index:index + len(old)] == old
              ]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one target, found {len(matches)}")
              index = matches[0]
              lines[index:index + len(old)] = new

          release_tool = Path("script/release_tool.rb")
          lines = release_tool.read_text().splitlines(keepends=True)
          replace_sequence(
              lines,
              ["    FILES = %w[\n"],
              ["    STATIC_FILES = %w[\n"],
              "release_tool constant",
          )
          replace_sequence(
              lines,
              ["      Waves-1.5.0-13.dmg\n"],
              [],
              "release_tool stale DMG entry",
          )
          replace_sequence(
              lines,
              [
                  "      actual = Dir.children(root).sort\n",
                  '      raise Error, "Elgato handoff file set is not exact" unless actual == FILES\n',
                  "      FILES.each do |name|\n",
              ],
              [
                  "      expected_files = files(metadata)\n",
                  "      actual = Dir.children(root).sort\n",
                  '      raise Error, "Elgato handoff file set is not exact" unless actual == expected_files\n',
                  "      expected_files.each do |name|\n",
              ],
              "release_tool exact file set",
          )
          replace_sequence(
              lines,
              ["        write_checksums!(staging)\n"],
              ["        write_checksums!(staging, metadata)\n"],
              "release_tool checksum writer call",
          )
          replace_sequence(
              lines,
              ["      verify_checksums!(root)\n"],
              ["      verify_checksums!(root, metadata)\n"],
              "release_tool checksum verifier call",
          )
          replace_sequence(
              lines,
              [
                  "    def dmg_name(metadata)\n",
                  '      "Waves-#{metadata.fetch(\'version\')}-#{metadata.fetch(\'build\')}.dmg"\n',
                  "    end\n",
              ],
              [
                  "    def dmg_name(metadata)\n",
                  '      "Waves-#{metadata.fetch(\'version\')}-#{metadata.fetch(\'build\')}.dmg"\n',
                  "    end\n",
                  "\n",
                  "    def files(metadata)\n",
                  "      (STATIC_FILES + [dmg_name(metadata)]).sort\n",
                  "    end\n",
              ],
              "release_tool dynamic file list",
          )
          replace_sequence(
              lines,
              [
                  "    def write_checksums!(root)\n",
                  "      names = FILES - %w[SHA256SUMS results.json]\n",
              ],
              [
                  "    def write_checksums!(root, metadata)\n",
                  "      names = files(metadata) - %w[SHA256SUMS results.json]\n",
              ],
              "release_tool checksum writer",
          )
          replace_sequence(
              lines,
              [
                  "    def verify_checksums!(root)\n",
                  "      expected_names = FILES - %w[SHA256SUMS results.json]\n",
              ],
              [
                  "    def verify_checksums!(root, metadata)\n",
                  "      expected_names = files(metadata) - %w[SHA256SUMS results.json]\n",
              ],
              "release_tool checksum verifier",
          )
          release_tool.write_text("".join(lines))

          collector = Path("release/elgato-handoff/collect-diagnostics.sh")
          lines = collector.read_text().splitlines(keepends=True)
          replace_sequence(
              lines,
              [
                  "/usr/bin/shasum -a 256 \\\n",
                  '  "$SCRIPT_ROOT/Waves-1.5.0-13.dmg" \\\n',
                  '  "$SCRIPT_ROOT/com.jonathanreed.waves.streamDeckPlugin" \\\n',
                  '  >"$OUTPUT_ROOT/handoff-artifact-checksums.txt"\n',
              ],
              [
                  'HANDOFF_JSON="$SCRIPT_ROOT/handoff.json"\n',
                  'DMG_NAME="$(\n',
                  "  /usr/bin/ruby --disable-gems -rjson -e '\n",
                  '    handoff = JSON.parse(File.read(ARGV.fetch(0)))\n',
                  '    name = handoff.fetch("artifacts").fetch("dmg").fetch("name")\n',
                  '    unless name.is_a?(String) && File.basename(name) == name &&\n',
                  r'        name.match?(/\AWaves-\d+\.\d+\.\d+-\d+\.dmg\z/)' + "\n",
                  '      abort("unsafe handoff DMG name")\n',
                  '    end\n',
                  '    puts name\n',
                  "  ' \"$HANDOFF_JSON\"\n",
                  ')"\n',
                  "/usr/bin/shasum -a 256 \\\n",
                  '  "$SCRIPT_ROOT/$DMG_NAME" \\\n',
                  '  "$SCRIPT_ROOT/com.jonathanreed.waves.streamDeckPlugin" \\\n',
                  '  >"$OUTPUT_ROOT/handoff-artifact-checksums.txt"\n',
              ],
              "diagnostics dynamic DMG",
          )
          collector.write_text("".join(lines))

          finalizer = Path("release/elgato-handoff/finalize-receipt.rb")
          lines = finalizer.read_text().splitlines(keepends=True)
          replace_sequence(
              lines,
              ["  IMMUTABLE_FILES = %w[\n"],
              ["  STATIC_IMMUTABLE_FILES = %w[\n"],
              "finalizer constant",
          )
          replace_sequence(
              lines,
              ["    Waves-1.5.0-13.dmg\n"],
              [],
              "finalizer stale DMG entry",
          )
          replace_sequence(
              lines,
              [
                  '    exact_keys!(handoff["artifacts"]["dmg"], %w[name sha256], "handoff DMG")\n',
                  '    sha256!(handoff["artifacts"]["dmg"]["sha256"], "handoff DMG SHA-256")\n',
              ],
              [
                  '    exact_keys!(handoff["artifacts"]["dmg"], %w[name sha256], "handoff DMG")\n',
                  '    sha256!(handoff["artifacts"]["dmg"]["sha256"], "handoff DMG SHA-256")\n',
                  '    dmg_name = handoff["artifacts"]["dmg"]["name"]\n',
                  '    expected_dmg_name = "Waves-#{handoff.fetch(\'version\')}-#{handoff.fetch(\'build\')}.dmg"\n',
                  '    unless dmg_name.is_a?(String) && File.basename(dmg_name) == dmg_name &&\n',
                  '        dmg_name == expected_dmg_name\n',
                  '      raise Error, "handoff DMG name is not canonical"\n',
                  '    end\n',
              ],
              "finalizer canonical DMG validation",
          )
          replace_sequence(
              lines,
              ['    raise Error, "handoff checksum file set is not exact" unless checksums.keys.sort == IMMUTABLE_FILES\n'],
              [
                  '    immutable_files = (\n',
                  '      STATIC_IMMUTABLE_FILES + [handoff.fetch("artifacts").fetch("dmg").fetch("name")]\n',
                  '    ).sort\n',
                  '    unless checksums.keys.sort == immutable_files\n',
                  '      raise Error, "handoff checksum file set is not exact"\n',
                  '    end\n',
              ],
              "finalizer dynamic immutable files",
          )
          finalizer.write_text("".join(lines))

          tests = Path("script/tests/release_infra_test.rb")
          lines = tests.read_text().splitlines(keepends=True)
          replace_sequence(
              lines,
              [
                  '      assert_includes collector, "/usr/sbin/system_profiler"\n',
                  '      refute_match(/defaults write|tccutil|killall|rm -rf/, collector)\n',
              ],
              [
                  '      assert_includes collector, "/usr/sbin/system_profiler"\n',
                  '      assert_includes collector, \'fetch("artifacts").fetch("dmg").fetch("name")\'\n',
                  '      refute_includes collector, "Waves-1.5.0-13.dmg"\n',
                  '      refute_match(/defaults write|tccutil|killall|rm -rf/, collector)\n',
              ],
              "release tests dynamic diagnostics assertion",
          )
          tests.write_text("".join(lines))

          for path in [release_tool, collector, finalizer]:
              if "Waves-1.5.0-13.dmg" in path.read_text():
                  raise SystemExit(f"{path}: stale release-specific DMG filename remains")
          PY

          ruby -c script/release_tool.rb
          ruby -c release/elgato-handoff/finalize-receipt.rb
          bash -n release/elgato-handoff/collect-diagnostics.sh
          ruby -Itest script/tests/release_infra_test.rb --name '/elgato_handoff/'
          git diff --check

          git config user.name "Jonathan R. Reed"
          git config user.email "130617826+JonathanRReed@users.noreply.github.com"
          git add \
            script/release_tool.rb \
            script/tests/release_infra_test.rb \
            release/elgato-handoff/collect-diagnostics.sh \
            release/elgato-handoff/finalize-receipt.rb
          git diff --cached --check
          git commit -m "fix(release): derive handoff artifacts from metadata"
          git push origin HEAD:release/v1.6.0
