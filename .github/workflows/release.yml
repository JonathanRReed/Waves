name: Release Candidate

# Manual, read-only verification workflow.
# Waves 1.5 is signed and notarized locally on the maintainer Mac. This workflow
# does not accept a tag, access signing credentials, sign, notarize, upload a
# release candidate, create a release, or publish anything.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact lowercase 40-character source revision"
        required: true

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact source and unsigned package
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact revision input
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be a lowercase 40-character Git revision."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$REQUESTED_REVISION"

      - name: Select latest available Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "::error::No versioned Xcode installation found on this runner."
            exit 1
          fi
          sudo xcode-select -s "$LATEST_XCODE"
          swift --version

      - name: Validate shared release preflight
        env:
          WAVES_EXPECTED_REVISION: ${{ inputs.revision }}
        run: ./script/release-gate.sh preflight

      - name: Run shared source and unsigned-package gate
        run: ./script/quality-gate.sh full

      - name: Upload unsigned verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waves-verification-${{ github.run_number }}
          path: |
            dist/*package*.log
            dist/*smoke*.log
          if-no-files-found: error
          retention-days: 14
