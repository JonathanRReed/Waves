name: Release

# Manual only. Waves 1.5 is signed and notarized locally on the maintainer Mac.
# This hosted path remains configured for future use, but it is not authoritative
# for 1.5 and never creates or pushes a tag. The dispatched tag must already be
# annotated with publication-sealed exact-revision evidence before the draft job
# can pass the shared publication gate.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated release tag to validate"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and unsigned package
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out tagged repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select latest available Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "::error::No versioned Xcode installation found on this runner."
            exit 1
          fi
          sudo xcode-select -s "$LATEST_XCODE"
          swift --version

      - name: Run shared source and package quality gate
        run: ./script/quality-gate.sh full

  sign:
    name: Hosted signing and notarization
    needs: verify
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out tagged repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release preflight before credentials
        run: ./script/release-gate.sh preflight

      # These names are intentionally preserved for the dormant hosted path.
      # They are not used by the authoritative local 1.5 release process.
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::error::Hosted signing secrets are not configured."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/waves-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarytool credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "::error::Hosted notarization secrets are not configured."
            exit 1
          fi
          xcrun notarytool store-credentials waves-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build, sign, notarize, and staple
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_PROFILE: waves-notary
        run: ./script/build_and_run.sh --notarize

      - name: Validate trust and packaged GUI before upload
        run: |
          ./script/build_and_run.sh --publication-check
          SMOKE_LOG_PATH="$GITHUB_WORKSPACE/dist/signed-package-smoke-process.log" \
            ./script/build_and_run.sh --package-smoke

      - name: Produce checksum, dSYM archive, and cask artifact
        run: |
          set -euo pipefail
          VERSION=$(ruby script/release_tool.rb metadata version)
          test -d dist/Waves.app.dSYM
          (cd dist && shasum -a 256 Waves.dmg > Waves.dmg.sha256)
          ditto -c -k --sequesterRsrc --keepParent dist/Waves.app.dSYM dist/Waves.app.dSYM.zip
          RELEASE_SHA256=$(shasum -a 256 dist/Waves.dmg | cut -d ' ' -f 1)
          export VERSION RELEASE_SHA256
          ruby -e '
            version = ENV.fetch("VERSION")
            digest = ENV.fetch("RELEASE_SHA256")
            abort "invalid SHA-256" unless digest.match?(/\A[0-9a-f]{64}\z/)
            template = File.read("Casks/waves.rb")
            abort "cask version drift" unless template.scan(/^\s*version\s+"([^"]+)"/).flatten == [version]
            placeholder = "RELEASE_WORKFLOW_REPLACES_THIS_SHA256"
            abort "cask placeholder drift" unless template.scan(placeholder).length == 1
            File.write("dist/waves.rb", template.sub(%(sha256 "#{placeholder}"), %(sha256 "#{digest}")))
          '
          ruby -c dist/waves.rb

      - name: Upload signed artifacts for the least-privilege draft job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waves-signed-candidate-${{ github.run_number }}
          path: |
            dist/Waves.app
            dist/Waves.dmg
            dist/Waves.dmg.sha256
            dist/Waves.app.dSYM
            dist/Waves.app.dSYM.zip
            dist/waves.rb
            dist/*package*.log
          if-no-files-found: error
          retention-days: 14

  draft-publication:
    name: Validate and create draft release
    needs: sign
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out exact annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: waves-signed-candidate-${{ github.run_number }}
          path: dist

      - name: Run exact-revision publication gate
        env:
          WAVES_RELEASE_TAG: ${{ inputs.tag }}
        run: ./script/release-gate.sh publication

      - name: Extract canonical release notes
        run: |
          set -euo pipefail
          VERSION=$(ruby script/release_tool.rb metadata version)
          awk -v version="$VERSION" '
            BEGIN { heading = "## [" version "]" }
            $0 == heading || index($0, heading " - ") == 1 { found = 1; inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/Waves.dmg
            dist/Waves.dmg.sha256
            dist/Waves.app.dSYM.zip
            dist/waves.rb
          draft: true
          body_path: dist/release-notes.md
