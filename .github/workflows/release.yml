name: Release Candidate

# Manual, read-only verification workflow.
# Waves releases are signed and notarized locally on the maintainer Mac. This
# workflow does not accept a tag, access signing credentials, sign, notarize,
# upload a release candidate, create a release, or publish anything.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact lowercase 40-character source revision"
        required: true

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact source and unsigned package
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact revision input
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be a lowercase 40-character Git revision."
            exit 1
          fi
          test "$(./script/release_git rev-parse HEAD)" = "$REQUESTED_REVISION"

      - name: Select a trusted Apple toolchain
        run: |
          set -euo pipefail
          TRUSTED_DEVELOPER_DIR=""
          candidates=(
            /Library/Developer/CommandLineTools
            /Applications/Xcode_*.app/Contents/Developer
          )
          for candidate in "${candidates[@]}"; do
            [ -d "$candidate" ] || continue
            SWIFT_PATH="$(DEVELOPER_DIR="$candidate" /usr/bin/xcrun --find swift 2>/dev/null || true)"
            SDK_PATH="$(DEVELOPER_DIR="$candidate" /usr/bin/xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)"
            [ -n "$SWIFT_PATH" ] && [ -n "$SDK_PATH" ] || continue
            if /usr/bin/ruby script/release_tool.rb trusted-toolchain \
              "$candidate" "$SDK_PATH" "$SWIFT_PATH" >/dev/null 2>&1; then
              TRUSTED_DEVELOPER_DIR="$candidate"
              break
            fi
          done
          if [ -z "$TRUSTED_DEVELOPER_DIR" ]; then
            echo "::error::No root-owned, non-writable Apple toolchain is available on this runner."
            exit 1
          fi
          sudo xcode-select -s "$TRUSTED_DEVELOPER_DIR"
          SDK_PATH="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          SWIFT_PATH="$(/usr/bin/xcrun --find swift)"
          /usr/bin/ruby script/release_tool.rb trusted-toolchain \
            "$TRUSTED_DEVELOPER_DIR" "$SDK_PATH" "$SWIFT_PATH" >/dev/null
          swift --version

      - name: Validate shared release preflight
        env:
          WAVES_EXPECTED_REVISION: ${{ inputs.revision }}
        run: ./script/release-gate.sh preflight

      - name: Run shared source and unsigned-package gate
        run: ./script/quality-gate.sh full

      - name: Upload unsigned verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waves-verification-${{ github.run_number }}
          path: |
            dist/*package*.log
            dist/*smoke*.log
          if-no-files-found: error
          retention-days: 14
