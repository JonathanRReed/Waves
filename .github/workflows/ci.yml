name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Shared quality gate
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest available Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "::error::No versioned Xcode installation found on this runner."
            exit 1
          fi
          sudo xcode-select -s "$LATEST_XCODE"
          swift --version

      - name: Run the same bounded quality gate used by the maintainer Mac
        run: ./script/quality-gate.sh full

      - name: Upload unsigned package evidence and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waves-ci-package-${{ github.run_number }}
          path: |
            dist/Waves.dmg
            dist/Waves.app.dSYM
            dist/package-*.log
          if-no-files-found: warn
          retention-days: 14
