name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Shared quality gate
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select a trusted Apple toolchain
        run: |
          set -euo pipefail
          TRUSTED_DEVELOPER_DIR=""
          candidates=(
            /Library/Developer/CommandLineTools
            /Applications/Xcode_*.app/Contents/Developer
          )
          for candidate in "${candidates[@]}"; do
            [ -d "$candidate" ] || continue
            SWIFT_PATH="$(DEVELOPER_DIR="$candidate" /usr/bin/xcrun --find swift 2>/dev/null || true)"
            SDK_PATH="$(DEVELOPER_DIR="$candidate" /usr/bin/xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)"
            [ -n "$SWIFT_PATH" ] && [ -n "$SDK_PATH" ] || continue
            if /usr/bin/ruby script/release_tool.rb trusted-toolchain \
              "$candidate" "$SDK_PATH" "$SWIFT_PATH" >/dev/null 2>&1; then
              TRUSTED_DEVELOPER_DIR="$candidate"
              break
            fi
          done
          if [ -z "$TRUSTED_DEVELOPER_DIR" ]; then
            echo "::error::No root-owned, non-writable Apple toolchain is available on this runner."
            exit 1
          fi
          sudo xcode-select -s "$TRUSTED_DEVELOPER_DIR"
          SDK_PATH="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          SWIFT_PATH="$(/usr/bin/xcrun --find swift)"
          /usr/bin/ruby script/release_tool.rb trusted-toolchain \
            "$TRUSTED_DEVELOPER_DIR" "$SDK_PATH" "$SWIFT_PATH" >/dev/null
          swift --version

      - name: Run the same bounded quality gate used by the maintainer Mac
        run: ./script/quality-gate.sh full

      - name: Upload unsigned package evidence and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waves-ci-package-${{ github.run_number }}
          path: |
            dist/Waves.dmg
            dist/Waves.app.dSYM
            dist/package-*.log
          if-no-files-found: warn
          retention-days: 14

  sequoia-tests:
    # Advisory: the oldest hosted macOS image (macos-14 was retired on
    # 2026-11-02). It cannot fail the workflow or the quality gate above.
    name: Ordinary tests on macOS 15 (advisory)
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
    env:
      # The newest Xcode on macos-15; its macOS 26.2 SDK builds this package.
      XCODE_APP: /Applications/Xcode_26.3.app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26.3 and its macOS 26 SDK
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this image. Installed: $(echo /Applications/Xcode_*.app)"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::$XCODE_APP provides macOS SDK $SDK_VERSION; this package needs a macOS 26 SDK."
            exit 1
          fi
          sw_vers
          echo "macOS SDK $SDK_VERSION"
          swift --version

      - name: Run the ordinary Swift test suite
        run: |
          set -euo pipefail
          TEST_HOME="$(mktemp -d)"
          HOME="$TEST_HOME" CFFIXED_USER_HOME="$TEST_HOME" swift test --skip RenderedUISmokeTests
